name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux:
    name: Linux Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Format Check
        run: cargo fmt --check

      - name: Library Tests
        run: cargo test --lib -- --test-threads=1

      - name: Build Debug Binary
        run: cargo build --bin deepseek

      - name: Task Worktree Runner Smoke
        run: target/debug/deepseek task fixture-smoke --json

      - name: GitHub Action Bridge Smoke
        run: target/debug/deepseek github fixture-smoke --json

      - name: TUI Entrypoint Smoke
        run: target/debug/deepseek tui --entrypoint-smoke --smoke-bin target/debug/deepseek

      - name: Secret Scan
        run: node scripts/check-secrets.js

      - name: Demo Evidence Checks
        run: |
          bash -n docs/demo/record-model-backed-demo.sh
          docs/demo/record-model-backed-demo.sh --dry-run
          docs/demo/record-model-backed-demo.sh --redaction-self-test
          docs/demo/verify-model-backed-demo.js --self-test
          docs/demo/render-model-backed-demo-svg.js --self-test

      - name: npm Metadata Checks
        run: |
          node npm/scripts/check-version-sync.js
          npm --prefix npm test

      - name: npm Wrapper TUI Entrypoint Smoke
        env:
          DEEPSEEK_BINARY: target/debug/deepseek
        run: node npm/scripts/test-tui-entrypoint-wrapper.js

      - name: Homebrew Formula Check
        run: node packaging/homebrew/verify-formula.js

  platform:
    name: Platform Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            binary: ./target/debug/deepseek
          - name: windows-x64
            os: windows-2025-vs2026
            binary: ./target/debug/deepseek.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check All Targets
        run: cargo check --all-targets

      - name: Build Debug Binary
        run: cargo build --bin deepseek

      - name: Verify Debug Binary
        run: ${{ matrix.binary }} version

      - name: Task Worktree Runner Smoke
        run: ${{ matrix.binary }} task fixture-smoke --json

      - name: GitHub Action Bridge Smoke
        run: ${{ matrix.binary }} github fixture-smoke --json

      - name: Windows Shell Supervisor ConPTY Smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test exec_shell_supervisor_status_treats_tcp_endpoint_as_ready --lib -- --nocapture
          cargo test shell_supervisor_tcp_endpoint_parser_accepts_loopback_only --lib -- --nocapture
          cargo test shell_supervisor_windows_tcp_daemon_client_smoke --lib -- --nocapture
          cargo test shell_supervisor_protocol_tty_start_records_native_pty_events --lib -- --nocapture
          cargo test shell_supervisor_protocol_native_pty_resize_records_event --lib -- --nocapture
          & "${{ matrix.binary }}" agents shell-fixture-smoke --json

      - name: TUI Demo Snapshot
        if: runner.os != 'Windows'
        env:
          DEEPSEEK_BINARY: ${{ matrix.binary }}
        run: |
          output="$("$DEEPSEEK_BINARY" tui --demo --once)"
          printf '%s\n' "$output"
          grep -q "DeepSeekCode" <<< "$output"
          grep -q "TUI" <<< "$output"

      - name: TUI Demo Snapshot
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DEEPSEEK_BINARY: ${{ matrix.binary }}
        run: |
          $output = & $env:DEEPSEEK_BINARY tui --demo --once
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $text = $output -join "`n"
          Write-Output $text
          if ($text -notmatch "DeepSeekCode" -or $text -notmatch "TUI") {
            throw "TUI demo snapshot did not render expected DeepSeekCode TUI text"
          }

      - name: TUI Entrypoint Smoke
        run: ${{ matrix.binary }} tui --entrypoint-smoke --smoke-bin ${{ matrix.binary }}
