name: npm Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release Matrix run id that uploaded npm-deepseek-* artifacts"
        required: true
      version:
        description: "npm package version to publish"
        required: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-npm:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm Version
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          test "${version}" = "${{ inputs.version }}"

      - name: Download npm Platform Packages
        uses: actions/download-artifact@v4
        with:
          pattern: npm-deepseek-*
          path: npm-dist
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; cannot publish npm packages."
            exit 1
          fi
          node npm/scripts/publish-npm-packages.js --dist npm-dist --root npm
